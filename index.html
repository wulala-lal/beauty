<style>
:root{
  --paper:#F6F3F1;
  --paper-2:#EFEAE6;
  --ink:#3C3733;
  --ink-2:#6B625D;
  --ink-3:#9C928B;
  --line:#E7E0DA;
  --accent:#B0A69C;
  --accent-tint:#F3EDE8;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;}

.shell{
  max-width:480px;
  margin:0 auto;
  padding:22px 22px 46px;
  min-height:100vh;
  position:relative;
}
@media (min-width:760px){
  body{background:var(--paper-2);}
  .shell{
    max-width:500px;
    min-height:auto;
    margin:28px auto;
    background:var(--paper);
    border-radius:22px;
    padding:30px 30px 50px;
    box-shadow:0 24px 70px rgba(60,55,51,.10);
  }
}

.view{display:none;}
.view.active{display:block;animation:fadeUp .34s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .view.active{animation:none;}
  *{transition-duration:.01ms !important;}
}

/* ---------- 封面 ---------- */
.brand-line{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:12px;letter-spacing:.16em;color:var(--ink-3);}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
.cover-img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;display:block;background:var(--paper-2);}
.cover-title{font-size:31px;line-height:1.34;letter-spacing:.01em;font-weight:600;margin:26px 0 9px;}
.cover-sub{font-size:15px;color:var(--ink-2);margin:0 0 16px;letter-spacing:.02em;}
.cover-lede{font-size:14.5px;line-height:1.95;color:var(--ink-2);margin:0 0 24px;}
.spectrum{display:flex;gap:4px;height:9px;margin-bottom:9px;}
.spectrum span{flex:1;border-radius:3px;}
.spectrum-cap{font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin:0 0 26px;}
.cover-meta{font-size:12.5px;line-height:1.75;color:var(--ink-3);text-align:center;margin:14px 0 0;}

.btn-primary{
  width:100%;height:52px;border-radius:28px;border:0;
  background:#3C3733;color:#FBF9F6;
  font:inherit;font-size:15.5px;letter-spacing:.08em;
  cursor:pointer;transition:transform .15s ease,background .2s ease;
}
.btn-primary:active{transform:scale(.985);}
.btn-primary:disabled{background:#DED5CF;color:#9A8F89;cursor:not-allowed;}
.btn-ghost{
  height:52px;padding:0 20px;border-radius:28px;
  background:transparent;border:1px solid var(--line);color:var(--ink-2);
  font:inherit;font-size:14.5px;cursor:pointer;transition:background .2s,border-color .2s;
}
.btn-ghost:hover{border-color:#D3C9C2;}

/* ---------- 答题 ---------- */
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.icon-btn{width:44px;height:44px;margin-left:-11px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;border-radius:50%;}
.icon-btn:hover{background:var(--accent-tint);color:var(--ink);}
.quiz-count{font-size:13px;letter-spacing:.08em;color:var(--ink-3);}
.quiz-count b{color:var(--ink);font-weight:600;font-size:15px;}
.progress{height:4px;background:#EAE2DC;border-radius:99px;overflow:hidden;}
.progress span{display:block;width:0;height:100%;border-radius:99px;background:#3C3733;transition:width .32s ease;}

.q-body{padding:36px 0 0;}
.q-index{font-size:12.5px;letter-spacing:.12em;color:var(--ink-3);margin:0 0 12px;}
.q-text{font-size:21px;line-height:1.64;font-weight:500;letter-spacing:.01em;margin:0 0 26px;}
.options{display:flex;flex-direction:column;gap:11px;}
.opt{
  display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
  padding:15px 17px;min-height:56px;
  border:1px solid var(--line);border-radius:14px;background:#fff;
  font:inherit;font-size:15px;line-height:1.7;color:var(--ink);
  cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s;
}
.opt:hover{border-color:#D6CCC5;}
.opt:focus-visible{outline:2px solid #B9AFA6;outline-offset:2px;}
.opt .badge{
  flex:0 0 24px;width:24px;height:24px;margin-top:2px;border-radius:50%;
  border:1px solid var(--line);
  display:grid;place-items:center;
  font-family:"Noto Serif SC","Songti SC",serif;font-size:12px;color:var(--ink-3);
  transition:.18s ease;
}
.opt[aria-pressed="true"]{border-color:#3C3733;background:#FFFCFA;box-shadow:0 7px 18px rgba(60,55,51,.07);}
.opt[aria-pressed="true"] .badge{background:#3C3733;border-color:#3C3733;color:#fff;}
.quiz-foot{display:flex;gap:10px;margin-top:30px;}
.quiz-foot .btn-primary{flex:1 1 auto;}

/* ---------- 结果 ---------- */
.res-kicker{font-size:12.5px;letter-spacing:.12em;color:var(--ink-3);margin:6px 0 12px;}
.res-name{font-size:40px;line-height:1.2;font-weight:600;margin:0;color:var(--accent);letter-spacing:.02em;}
.res-en{font-size:11.5px;letter-spacing:.2em;color:var(--ink-3);margin:11px 0 0;text-transform:uppercase;}
.res-tagline{font-size:15px;line-height:1.85;color:var(--ink-2);margin:15px 0 24px;}
.res-photo{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;background:var(--paper-2);}

.dims{margin-top:30px;padding:20px 20px 6px;background:#fff;border:1px solid var(--line);border-radius:16px;}
.dims-head{font-size:13px;letter-spacing:.1em;color:var(--ink-3);margin:0 0 18px;}
.dim{margin-bottom:20px;}
.dim-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:9px;}
.dim-top b{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
.dim-track{position:relative;height:4px;border-radius:99px;background:#EFE8E3;}
.dim-track .fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--accent);opacity:.55;}
.dim-track .knob{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);transform:translate(-50%,-50%);}
.dim-note{font-size:12.5px;line-height:1.75;color:var(--ink-3);margin:9px 0 0;}
.dims-ends{display:flex;justify-content:space-between;font-size:11px;color:#B7ADA6;margin-top:4px;}

.sec{margin-top:34px;}
.sec h3{font-size:17px;font-weight:600;letter-spacing:.03em;margin:0 0 5px;}
.sec .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px;}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
.sw .chip{height:48px;}
.sw .meta{padding:7px 9px 9px;}
.sw .nm{font-size:12.5px;line-height:1.45;color:var(--ink);}
.sw .hx{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;}
.avoid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.avoid .sw .chip{height:38px;}
.avoid .sw .meta{padding:6px 8px 8px;}
.avoid .sw .nm{font-size:12px;}

.advice{margin-top:34px;border-top:1px solid var(--line);padding-top:26px;}
.adv{padding-bottom:24px;}
.adv:last-child{padding-bottom:0;}
.adv h4{font-size:15.5px;font-weight:600;letter-spacing:.03em;margin:0 0 9px;display:flex;align-items:center;gap:8px;}
.adv h4 svg{width:14px;height:14px;flex:0 0 auto;opacity:.5;}
.adv p{font-size:14.5px;line-height:1.95;color:var(--ink-2);margin:0 0 8px;}
.adv p:last-child{margin-bottom:0;}

.summary{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px;}
.tag{font-size:12.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;}

.res-actions{display:flex;flex-direction:column;gap:10px;margin-top:36px;}
.res-note{font-size:12px;line-height:1.8;color:var(--ink-3);margin:14px 0 0;text-align:center;}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:#3C3733;color:#FBF9F6;font-size:13.5px;letter-spacing:.04em;
  padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:360px){
  .q-text{font-size:19px;}
  .cover-title{font-size:27px;}
  .pal{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

/* ============ 题库：每题选项携带维度权重 ============ */
const QUESTIONS = [
  {q:"自然光下观察手腕内侧静脉，你的静脉偏向？", o:[

    {t:"有时发红有时晒棕", v:{temp:"N"}}]},
  {q:"佩戴首饰，哪一类戴在肤色上更衬人？", o:[

    {t:"差别不大", v:{temp:"N"}}]},

    {t:"深棕、乌黑、浓黑", v:{light:"D"}}]},
  {q:"原生发色自带的底调质感？", o:[

    {t:"带青灰、雾感、炭灰感", v:{temp:"C"}},
    {t:"无明显金 / 青底调", v:{temp:"N"}}]},
  {q:"原生瞳孔的通透感？", o:[

    toastShow.t = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  /* ---------- 答题 ---------- */
  function renderQuestion(){
    const q = QUESTIONS[idx];
    qText.textContent = q.q;
    qNum.textContent = idx + 1;
    qNow.textContent = idx + 1;

    const step = (idx + (answers[idx] !== null ? 1 : 0)) / QUESTIONS.length;
    progressFill.style.width = (step * 100).toFixed(1) + '%';

    options.innerHTML = '';
    q.o.forEach(function(o, i){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.setAttribute('aria-pressed', answers[idx] === i ? 'true' : 'false');
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = LETTERS[i];
      const label = document.createElement('span');
      label.textContent = o.t;
      btn.appendChild(badge);
      btn.appendChild(label);
      btn.addEventListener('click', function(){
        answers[idx] = i;
        renderQuestion();
      });
      options.appendChild(btn);
    });

    nextBtn.disabled = answers[idx] === null;
    nextBtn.textContent = idx === QUESTIONS.length - 1 ? '查看我的季型' : '下一题';
    prevBtn.disabled = idx === 0;
    prevBtn.style.opacity = idx === 0 ? '.45' : '1';
    prevBtn.style.cursor = idx === 0 ? 'not-allowed' : 'pointer';
  }

  function start(){
    answers = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    renderQuestion();
    show('quiz');
  }

  /* ---------- 计算 ---------- */
  function computeProfile(){
    const c = {
      temp:{W:0,C:0,N:0},
      light:{L:0,D:0,M:0},
      sat:{C:0,S:0,M:0},
      con:{H:0,L:0,M:0},
      aff:{spring:0,summer:0,autumn:0,winter:0}
    };
    answers.forEach(function(a, i){
      const v = QUESTIONS[i].o[a].v;
      if (v.temp) c.temp[v.temp]++;
      if (v.light) c.light[v.light]++;
      if (v.sat) c.sat[v.sat]++;
      if (v.con) c.con[v.con]++;
      if (v.aff && v.aff !== 'none') c.aff[v.aff]++;
    });

    let temp;
    if (c.temp.W > c.temp.C) temp = 1;
    else if (c.temp.C > c.temp.W) temp = -1;
    else temp = (c.aff.spring + c.aff.autumn >= c.aff.summer + c.aff.winter) ? 1 : -1;

    const light = (c.light.L - c.light.D) / 3;
    const sat = (c.sat.C - c.sat.S) / 2;
    const con = (c.con.H - c.con.L) / 4;

    const tempNeutral = c.temp.N >= Math.max(c.temp.W, c.temp.C);
    const lightNeutral = Math.abs(light) <= 0.34;
    const satMid = Math.abs(sat) <= 0.25;
    const conMid = Math.abs(con) <= 0.3;

    const tempLabel = tempNeutral
      ? (temp > 0 ? '中性偏暖' : '中性偏冷')
      : (temp > 0 ? '暖' : '冷');
    const lightLabel = lightNeutral ? '中' : (light > 0 ? '浅' : '深');
    const satLabel = satMid ? '中等' : (sat > 0 ? '清透' : '柔浊');
    const conLabel = conMid ? '中' : (con > 0 ? '高' : '低');

    let best = TYPES[0], bestD = Infinity;
    TYPES.forEach(function(T){
      const d = 1.8 * Math.pow(temp - T.taim[0], 2)
              + 1.1 * Math.pow(light - T.taim[1], 2)
              + 1.0 * Math.pow(sat - T.taim[2], 2)
              + 1.2 * Math.pow(con - T.taim[3], 2);
      if (d < bestD) { bestD = d; best = T; }
    });

    return {
      temp: temp, light: light, sat: sat, con: con,
      tempNeutral: tempNeutral, lightNeutral: lightNeutral,
      satMid: satMid, conMid: conMid,
      tempLabel: tempLabel, lightLabel: lightLabel,
      satLabel: satLabel, conLabel: conLabel,
      type: best
    };
  }

  function notes(p){
    const tempNote = p.tempNeutral
      ? (p.temp > 0
        ? '冷暖界限模糊，整体略偏暖：暖浊色、中性色都能穿，纯冷正色建议先试过再买。'
        : '冷暖界限模糊，整体略偏冷：灰调冷色更稳，暖橙系尽量只做小面积点缀。')
      : (p.temp > 0
        ? '暖底色：带黄调、红调的颜色更容易融进你的肤色，冷调正色容易显黄显灰。'
        : '冷底色：带蓝调、青调的颜色让你更干净通透，暖土色容易把脸色带黄。');

    const lightNote = p.lightNeutral
      ? '明度居中：浅、中、深都能驾驭，主次交给对比度来决定就好。'
      : (p.light > 0
        ? '明度偏高：浅色比深色更衬人，从头到脚一身深色容易压住气色。'
        : '明度偏深：中深到深色更有质感，浅淡柔和的颜色会显得没有分量。');

    const satNote = p.satMid
      ? '饱和度不用刻意拉高或压低，避开极端的荧光色就不会出错。'
      : (p.sat > 0
        ? '颜色越干净通透越好看；灰浊、雾面的颜色容易显脏显旧。'
        : '灰调柔和的颜色更协调；纯亮色会抢走你五官的存在感。');

    const conNote = p.conMid
      ? '中等对比最稳：一处亮点配大面积低反差，是最好用的搭配公式。'
      : (p.con > 0
        ? '高对比更出彩：亮色配深色、纯黑配纯白，都比同色系更提气。'
        : '低反差更舒服：同色系、邻近色最自然，强撞色会把人割裂。');

    return {tempNote:tempNote, lightNote:lightNote, satNote:satNote, conNote:conNote};
  }

  function dimBlock(label, value, val, note){
    const pos = ((val + 1) / 2 * 100).toFixed(1);
    return '<div class="dim">'
      + '<div class="dim-top"><span>' + label + '</span><b>' + value + '</b></div>'
      + '<div class="dim-track"><span class="fill" style="width:' + pos + '%"></span>'
      + '<span class="knob" style="left:' + pos + '%"></span></div>'
      + '<p class="dim-note">' + note + '</p>'
      + '</div>';
  }

  /* ---------- 结果 ---------- */
  function renderResult(){
    const p = computeProfile();
    const T = p.type;
    current = T;
    const n = notes(p);

    document.documentElement.style.setProperty('--accent', T.accent);
    document.documentElement.style.setProperty('--accent-tint', '#F5F0EC');

    resHead.innerHTML =
      '<p class="res-kicker">' + T.kicker + ' · 第 ' + T.id + ' 型</p>'
      + '<h2 class="res-name serif">' + T.name + '</h2>'
      + '<p class="res-en">' + T.en + '</p>'
      + '<p class="res-tagline">' + T.tagline + '</p>'
      + '<img class="res-photo" alt="' + T.name + '配色与单品示范" src="' + document.getElementById('img-' + T.id).src + '">';

    let html = '';
    html += '<div class="dims"><p class="dims-head">你的色彩坐标</p>'
      + dimBlock('冷暖', p.tempLabel, p.temp, n.tempNote)
      + dimBlock('明度', p.lightLabel, p.light, n.lightNote)
      + dimBlock('饱和度', p.satLabel, p.sat, n.satNote)
      + dimBlock('对比度', p.conLabel, p.con, n.conNote)
      + '</div>';

    html += '<section class="sec"><h3 class="serif">最适合你的颜色</h3>'
      + '<p class="sub">上脸最不容易出错的一组，闭眼买也不会翻车</p><div class="pal">';
    T.good.forEach(function(g){
      html += '<div class="sw"><div class="chip" style="background:' + g.h + '"></div>'
        + '<div class="meta"><div class="nm">' + g.n + '</div><div class="hx">' + g.h + '</div></div></div>';
    });
    html += '</div></section>';

    html += '<section class="sec"><h3 class="serif">尽量少碰的颜色</h3>'
      + '<p class="sub">不是不能穿，是会让气色打折</p><div class="avoid">';
    T.avoid.forEach(function(g){
      html += '<div class="sw"><div class="chip" style="background:' + g.h + '"></div>'
        + '<div class="meta"><div class="nm">' + g.n + '</div></div></div>';
    });
    html += '</div></section>';

    html += '<div class="advice">'
      + advItem('服装配色', T.colors)
      + advItem('款式与面料', T.style)
      + advItem('饰品', T.jewel)
      + advItem('妆容与发色', T.beauty)
      + '</div>';

    resBody.innerHTML = html;
    show('result');
  }

  function advItem(title, text){
    return '<div class="adv"><h4 class="serif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>' + title + '</h4><p>' + text + '</p></div>';
  }

  /* ---------- 事件 ---------- */
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  nextBtn.addEventListener('click', function(){
    if (answers[idx] === null) return;
    if (idx < QUESTIONS.length - 1) {
      idx++;
      renderQuestion();
    } else {
      renderResult();
    }
  });

  prevBtn.addEventListener('click', function(){
    if (idx > 0) { idx--; renderQuestion(); }
  });

  backBtn.addEventListener('click', function(){
    if (idx > 0) { idx--; renderQuestion(); }
    else { show('cover'); }
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    if (!current) return;
    const T = current;
    const text = '我的四季色彩是「' + T.name + '」｜' + T.summary.join(' · ') + '\n'
      + '适合：' + T.good.map(function(g){return g.n;}).join('、') + '\n'
      + '避开：' + T.avoid.map(function(g){return g.n;}).join('、') + '\n'
      + T.tagline + '\n——来自「测测你的四季色彩」';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toastShow('文案已复制，去小红书发一篇吧'); },
        function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toastShow('文案已复制'); }
    catch(e) { toastShow('复制失败，请手动选中文本'); }
    document.body.removeChild(ta);
  }
})();
</script>
